apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: wellnesshub
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 5; done']
      containers:
        - name: postgres-init
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: wellnesshub-secret
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              psql -h postgres-service -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'WellnessHubAdmin'" | grep -q 1 || psql -h postgres-service -U postgres -c 'CREATE DATABASE "WellnessHubAdmin";'
              psql -h postgres-service -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'WellnessHubbase'" | grep -q 1 || psql -h postgres-service -U postgres -c 'CREATE DATABASE "WellnessHubbase";'
              psql -h postgres-service -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'EntrepriseXdb'" | grep -q 1 || psql -h postgres-service -U postgres -c 'CREATE DATABASE "EntrepriseXdb";'
              psql -h postgres-service -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'EntrepriseYdb'" | grep -q 1 || psql -h postgres-service -U postgres -c 'CREATE DATABASE "EntrepriseYdb";'
              echo "All databases initialized!"
